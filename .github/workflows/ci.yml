
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[s3]"

      - name: Configure DVC remote credentials
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify origin access_key_id "$DAGSHUB_USER" --local
          dvc remote modify origin secret_access_key "$DAGSHUB_TOKEN" --local

      - name: Pull data for this Git version
        run: dvc pull

      - name: Run tests
        run: python -m pytest

      - name: Run the pipeline on day 1
        run: python run_pipeline.py data/raw/orders_day1.csv
